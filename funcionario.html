<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condomínio - Minhas tarefas</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:16px}
  .wrap{max-width:480px;margin:0 auto}
  .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:1.2rem;margin:0}
  .sub{color:#6b7280;font-size:.9rem;text-transform:capitalize}
  button{font-size:1rem;border-radius:8px;border:0;padding:12px;cursor:pointer}
  .primario{background:#2563eb;color:#fff;width:100%}
  .primario:disabled{background:#9ca3af}
  .sec{background:#e5e7eb;color:#111;padding:8px 12px}
  #resumo{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;
          font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .trilha{position:relative;margin-left:12px;border-left:3px solid #d1d5db;padding-left:20px}
  .item{position:relative;background:#fff;border-radius:12px;padding:14px;
        margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .item::before{content:"";position:absolute;left:-30px;top:18px;width:16px;height:16px;
        border-radius:50%;background:#9ca3af;border:3px solid #f3f4f6}
  .item.feita::before{background:#16a34a}
  .item.atrasada::before{background:#dc2626}
  .item.pendente::before{background:#2563eb}
  .hora{font-weight:700}
  .nome{margin:2px 0}
  .area{color:#6b7280;font-size:.9rem}
  .selo{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:999px;margin-top:6px}
  .feita .selo{background:#dcfce7;color:#166534}
  .atrasada .selo{background:#fee2e2;color:#991b1b}
  .pendente .selo{background:#dbeafe;color:#1e40af}
  .item button{margin-top:10px;width:100%}
  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
         align-items:flex-end;justify-content:center}
  .fundo.aberta{display:flex}
  .folha{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;
         padding:20px;max-height:90vh;overflow:auto}
  label{display:block;font-weight:600;margin:12px 0 6px}
  textarea,input{width:100%;padding:12px;font-size:1rem;border:1px solid #ccc;border-radius:8px}
  #msg,#edMsg{margin-top:12px;font-size:.95rem}
  .fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
  .fotos img{width:100%;border-radius:8px;display:block}
  .fcard button{width:100%;margin-top:6px}
  #detSolic{margin:12px 0;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <div>
      <h1>Olá, <span id="nome"></span></h1>
      <div class="sub" id="data"></div>
    </div>
    <button class="sec" id="sair">Sair</button>
  </div>

  <div id="resumo">Carregando...</div>
  <div class="trilha" id="trilha"></div>
</div>

<!-- Painel: registrar execução -->
<div class="fundo" id="fundo">
  <div class="folha">
    <h2 id="folhaTitulo" style="margin:0 0 8px"></h2>

    <label for="obs">Observação (opcional)</label>
    <textarea id="obs" rows="3"></textarea>

    <label for="fotos">Fotos (evidências)</label>
    <input id="fotos" type="file" accept="image/*" multiple>

    <button class="primario" id="enviar" style="margin-top:16px">Enviar registro</button>
    <button class="sec" id="cancelar" style="width:100%;margin-top:8px">Cancelar</button>
    <div id="msg"></div>
  </div>
</div>

<!-- Painel: ver registro -->
<div class="fundo" id="fundoDet">
  <div class="folha">
    <h2 id="detTitulo" style="margin:0 0 4px"></h2>
    <div class="area" id="detHora"></div>
    <div id="detObs" style="margin-top:12px"></div>
    <div class="fotos" id="detFotos"></div>
    <div id="detSolic"></div>
    <div id="detAcao"></div>
    <button class="sec" id="fecharDet" style="width:100%;margin-top:12px">Fechar</button>
  </div>
</div>

<!-- Painel: editar registro (após aprovação) -->
<div class="fundo" id="fundoEd">
  <div class="folha">
    <h2 id="edTitulo" style="margin:0 0 8px"></h2>

    <label for="edObs">Observação</label>
    <textarea id="edObs" rows="3"></textarea>

    <label>Fotos atuais</label>
    <div class="fotos" id="edFotos"></div>

    <label for="edNovas">Acrescentar fotos</label>
    <input id="edNovas" type="file" accept="image/*" multiple>

    <button class="primario" id="edSalvar" style="margin-top:16px">Salvar edição</button>
    <button class="sec" id="edCancelar" style="width:100%;margin-top:8px">Cancelar</button>
    <div id="edMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira",
                "quinta-feira","sexta-feira","sábado"];
  const msg = document.getElementById("msg");
  const btn = document.getElementById("enviar");
  let usuario = null;
  let tarefaAtual = null;

  function el(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }
  function minutos(t) {
    if (!t) return null;
    const p = t.split(":");
    return Number(p[0]) * 60 + Number(p[1]);
  }
  function hhmm(t) { return t ? t.slice(0, 5) : "--:--"; }
  function horaDe(iso) {
    return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  // Reduz a foto para caber no limite de 5 MB
  function comprimir(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Falha ao reduzir a foto")),
                 "image/jpeg", 0.8);
      };
      img.onerror = () => reject(new Error("Arquivo de imagem inválido"));
      img.src = URL.createObjectURL(file);
    });
  }

  // Tenta a operação até 3 vezes (ajuda quando a rede oscila)
  async function tentar(fn) {
    let ultimo;
    for (let i = 1; i <= 3; i++) {
      try {
        const r = await fn();
        if (!r.error) return r;
        ultimo = r.error;
      } catch (e) { ultimo = e; }
      await new Promise(ok => setTimeout(ok, 1500));
    }
    throw ultimo;
  }

  // Envia uma foto e devolve o endereço público dela
  async function enviarFoto(arquivo, pasta) {
    const blob = await comprimir(arquivo);
    const caminho = pasta + "/" + crypto.randomUUID() + ".jpg";
    await tentar(() => db.storage.from("evidencias")
      .upload(caminho, blob, { contentType: "image/jpeg" }));
    return db.storage.from("evidencias").getPublicUrl(caminho).data.publicUrl;
  }

  // ---------- Painel de registrar ----------
  function abrir(t) {
    tarefaAtual = t.id;
    document.getElementById("folhaTitulo").textContent = t.nome;
    document.getElementById("obs").value = "";
    document.getElementById("fotos").value = "";
    msg.textContent = "";
    document.getElementById("fundo").classList.add("aberta");
  }
  function fechar() {
    document.getElementById("fundo").classList.remove("aberta");
  }

  // ---------- Painel de ver registro ----------
  function fecharDet() {
    document.getElementById("fundoDet").classList.remove("aberta");
  }

  async function verRegistro(t, reg) {
    const fotosBox = document.getElementById("detFotos");
    const solicBox = document.getElementById("detSolic");
    const acaoBox = document.getElementById("detAcao");

    document.getElementById("detTitulo").textContent = t.nome;
    document.getElementById("detHora").textContent =
      "Concluída às " + horaDe(reg.criado_em) +
      (reg.editado_em ? " · editada às " + horaDe(reg.editado_em) : "");
    document.getElementById("detObs").textContent =
      reg.observacao ? "Observação: " + reg.observacao : "Sem observação.";
    fotosBox.innerHTML = "";
    solicBox.textContent = "Carregando...";
    acaoBox.innerHTML = "";
    document.getElementById("fundoDet").classList.add("aberta");

    const rf = await db.from("fotos").select("id, url").eq("registro_id", reg.id);
    const rs = await db.from("solicitacoes_edicao").select("status")
      .eq("registro_id", reg.id).order("criado_em", { ascending: false }).limit(1);

    if (rf.error) {
      fotosBox.textContent = "Erro ao carregar fotos: " + rf.error.message;
    } else {
      rf.data.forEach(f => {
        const i = document.createElement("img");
        i.src = f.url; i.loading = "lazy"; i.alt = "Evidência";
        fotosBox.appendChild(i);
      });
    }

    const ultima = rs.data && rs.data[0] ? rs.data[0].status : null;
    const textos = {
      pendente: "⏳ Pedido de edição enviado. Aguardando o administrador.",
      aprovada: "✅ Pedido de edição aprovado. Você já pode editar.",
      recusada: "❌ Pedido de edição recusado.",
      concluida: "Edição concluída."
    };
    solicBox.textContent = ultima ? textos[ultima] : "";

    const autor = reg.funcionario_id === usuario.id;

    // Pedido aprovado: libera o botão de editar
    if (autor && ultima === "aprovada") {
      const ed = el("button", "primario", "Editar registro");
      ed.addEventListener("click", () => abrirEdicao(t, reg, rf.data || []));
      acaoBox.appendChild(ed);
      return;
    }

    // Sem pedido em aberto: permite solicitar edição
    const podePedir = autor && (!ultima || ultima === "recusada" || ultima === "concluida");
    if (!podePedir) return;

    const pedir = el("button", "sec", "Solicitar edição ao administrador");
    pedir.style.width = "100%";
    pedir.addEventListener("click", () => {
      acaoBox.innerHTML = "";
      const lab = el("label", "", "Motivo do pedido");
      const txt = el("textarea");
      txt.rows = 3;
      txt.placeholder = "Explique o que precisa ser corrigido";
      const env = el("button", "primario", "Enviar pedido");
      env.style.marginTop = "12px";
      const aviso = el("div", "", "");
      aviso.style.marginTop = "8px";

      env.addEventListener("click", async () => {
        const motivo = txt.value.trim();
        if (motivo.length < 5) { aviso.textContent = "Descreva o motivo (mínimo 5 letras)."; return; }
        env.disabled = true;
        aviso.textContent = "Enviando...";
        const { error } = await db.from("solicitacoes_edicao")
          .insert({ registro_id: reg.id, solicitante_id: usuario.id, motivo: motivo });
        if (error) {
          aviso.textContent = error.code === "23505"
            ? "Já existe um pedido pendente para este registro."
            : "Erro: " + error.message;
          env.disabled = false;
          return;
        }
        verRegistro(t, reg);
      });

      acaoBox.append(lab, txt, env, aviso);
    });
    acaoBox.appendChild(pedir);
  }

  // ---------- Painel de editar (após aprovação) ----------
  let edReg = null, edLista = [], edRemover = new Set(), edInseriu = false, edUrlsNovas = [];
  const edMsg = document.getElementById("edMsg");

  function fecharEd() {
    document.getElementById("fundoEd").classList.remove("aberta");
  }

  function abrirEdicao(t, reg, fotos) {
    edReg = reg; edLista = fotos; edRemover = new Set();
    edInseriu = false; edUrlsNovas = [];
    document.getElementById("edTitulo").textContent = "Editar: " + t.nome;
    document.getElementById("edObs").value = reg.observacao || "";
    document.getElementById("edNovas").value = "";
    edMsg.textContent = "";

    const box = document.getElementById("edFotos");
    box.innerHTML = "";
    fotos.forEach(f => {
      const card = el("div", "fcard");
      const img = document.createElement("img");
      img.src = f.url; img.alt = "Foto atual";
      const b = el("button", "sec", "Remover");
      b.addEventListener("click", () => {
        if (edRemover.has(f.id)) {
          edRemover.delete(f.id); b.textContent = "Remover"; img.style.opacity = 1;
        } else {
          edRemover.add(f.id); b.textContent = "Desfazer"; img.style.opacity = 0.3;
        }
      });
      card.append(img, b);
      box.appendChild(card);
    });
    document.getElementById("fundoEd").classList.add("aberta");
  }

  document.getElementById("edSalvar").addEventListener("click", async () => {
    const novos = document.getElementById("edNovas").files;
    const restantes = edLista.filter(f => !edRemover.has(f.id)).length;
    if (restantes + novos.length === 0) {
      edMsg.textContent = "O registro precisa ficar com pelo menos uma foto.";
      return;
    }
    const salvar = document.getElementById("edSalvar");
    salvar.disabled = true;
    let etapa = "";
    try {
      // 1) Envia as fotos novas (só uma vez, mesmo se tentar de novo)
      if (!edInseriu) {
        const urls = [];
        for (let i = 0; i < novos.length; i++) {
          etapa = "foto nova " + (i + 1) + " de " + novos.length;
          edMsg.textContent = "Enviando " + etapa + "...";
          urls.push(await enviarFoto(novos[i], edReg.id));
        }
        if (urls.length) {
          etapa = "ligação das fotos";
          await tentar(() => db.from("fotos")
            .insert(urls.map(u => ({ registro_id: edReg.id, url: u }))));
        }
        edInseriu = true;
      }

      // 2) Remove as fotos marcadas
      if (edRemover.size) {
        etapa = "remoção das fotos";
        edMsg.textContent = "Removendo fotos...";
        await tentar(() => db.from("fotos").delete().in("id", Array.from(edRemover)));
        edRemover = new Set(); edLista = edLista.filter(f => false);
      }

      // 3) Salva a observação e conclui o pedido
      etapa = "salvar observação";
      edMsg.textContent = "Salvando...";
      await tentar(() => db.rpc("concluir_edicao", {
        p_registro: edReg.id,
        p_obs: document.getElementById("edObs").value.trim() || null
      }));

      fecharEd();
      fecharDet();
      await carregar();
    } catch (e) {
      edMsg.textContent = "Erro na etapa (" + etapa + "): " + e.message +
        ". Toque em Salvar para tentar de novo.";
    }
    salvar.disabled = false;
  });
  document.getElementById("edCancelar").addEventListener("click", fecharEd);

  // ---------- Trilha do dia ----------
  async function carregar() {
    const agora = new Date();
    const inicio = new Date();
    inicio.setHours(0, 0, 0, 0);
    document.getElementById("data").textContent =
      DIAS[agora.getDay()] + ", " + agora.toLocaleDateString("pt-BR");

    const { data: tarefas, error } = await db.from("tarefas")
      .select("id, nome, area, horario_previsto")
      .eq("ativa", true)
      .contains("dias_semana", [agora.getDay()])
      .order("horario_previsto", { ascending: true });
    if (error) { document.getElementById("resumo").textContent = "Erro: " + error.message; return; }

    const { data: regs, error: e2 } = await db.from("registros_execucao")
      .select("id, tarefa_id, funcionario_id, observacao, criado_em, editado_em")
      .gte("criado_em", inicio.toISOString())
      .order("criado_em", { ascending: true });
    if (e2) { document.getElementById("resumo").textContent = "Erro: " + e2.message; return; }

    const feitas = {};
    regs.forEach(r => { if (!feitas[r.tarefa_id]) feitas[r.tarefa_id] = r; });

    const agoraMin = agora.getHours() * 60 + agora.getMinutes();
    const trilha = document.getElementById("trilha");
    trilha.innerHTML = "";
    let qtdFeitas = 0;

    tarefas.forEach(t => {
      const reg = feitas[t.id];
      const prev = minutos(t.horario_previsto);
      let estado = "pendente", texto = "Pendente";
      if (reg) { estado = "feita"; texto = "Concluída às " + horaDe(reg.criado_em); qtdFeitas++; }
      else if (prev !== null && prev < agoraMin) { estado = "atrasada"; texto = "Atrasada"; }

      const item = el("div", "item " + estado);
      item.appendChild(el("div", "hora", hhmm(t.horario_previsto)));
      item.appendChild(el("div", "nome", t.nome));
      item.appendChild(el("div", "area", t.area));
      item.appendChild(el("span", "selo", texto));

      if (reg) {
        const v = el("button", "sec", "Ver registro");
        v.addEventListener("click", () => verRegistro(t, reg));
        item.appendChild(v);
      } else {
        const b = el("button", "primario", "Registrar execução");
        b.addEventListener("click", () => abrir(t));
        item.appendChild(b);
      }
      trilha.appendChild(item);
    });

    document.getElementById("resumo").textContent = tarefas.length === 0
      ? "Nenhuma tarefa programada para hoje."
      : qtdFeitas + " de " + tarefas.length + " tarefas concluídas hoje";
  }

  async function iniciar() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { location.href = "index.html"; return; }

    const { data: perfil } = await db.from("usuarios")
      .select("nome, perfil").eq("id", session.user.id).single();
    if (!perfil || !["funcionario", "admin"].includes(perfil.perfil)) {
      location.href = "index.html"; return;
    }
    usuario = { id: session.user.id };
    document.getElementById("nome").textContent = perfil.nome;
    await carregar();
  }

  // ---------- Enviar registro (fotos primeiro, registro depois) ----------
  btn.addEventListener("click", async () => {
    const arquivos = document.getElementById("fotos").files;
    if (arquivos.length === 0) { msg.textContent = "Selecione pelo menos uma foto."; return; }

    btn.disabled = true;
    const registroId = crypto.randomUUID();
    const urls = [];
    let etapa = "";
    try {
      for (let i = 0; i < arquivos.length; i++) {
        etapa = "foto " + (i + 1) + " de " + arquivos.length;
        msg.textContent = "Enviando " + etapa + "...";
        urls.push(await enviarFoto(arquivos[i], registroId));
      }

      etapa = "registro";
      msg.textContent = "Salvando registro...";
      await tentar(() => db.from("registros_execucao").insert({
        id: registroId,
        tarefa_id: tarefaAtual,
        funcionario_id: usuario.id,
        observacao: document.getElementById("obs").value.trim() || null
      }));

      etapa = "ligação das fotos";
      await tentar(() => db.from("fotos")
        .insert(urls.map(u => ({ registro_id: registroId, url: u }))));

      fechar();
      await carregar();
    } catch (e) {
      msg.textContent = "Erro na etapa (" + etapa + "): " + e.message +
        ". Toque em Enviar para tentar de novo.";
    }
    btn.disabled = false;
  });

  document.getElementById("cancelar").addEventListener("click", fechar);
  document.getElementById("fecharDet").addEventListener("click", fecharDet);
  document.getElementById("sair").addEventListener("click", async () => {
    await db.auth.signOut();
    location.href = "index.html";
  });

  iniciar();
</script>
</body>
</html>
