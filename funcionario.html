<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condomínio - Funcionário</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:16px}
  .card{background:#fff;padding:20px;border-radius:12px;max-width:420px;
        margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  h1{font-size:1.2rem;margin:0}
  label{display:block;font-weight:600;margin:12px 0 6px}
  select,textarea,input,button{width:100%;padding:12px;font-size:1rem;
        border-radius:8px;box-sizing:border-box;border:1px solid #ccc}
  button{background:#2563eb;color:#fff;border:0;margin-top:16px}
  button:disabled{background:#9ca3af}
  #sair{width:auto;background:#e5e7eb;color:#111;margin:0;padding:8px 12px}
  #msg{margin-top:12px;font-size:.95rem}
</style>
</head>
<body>
<div class="card">
  <div class="topo">
    <h1>Olá, <span id="nome"></span></h1>
    <button id="sair">Sair</button>
  </div>

  <label for="tarefa">Tarefa executada</label>
  <select id="tarefa"><option value="">Escolha...</option></select>

  <label for="obs">Observação (opcional)</label>
  <textarea id="obs" rows="3"></textarea>

  <label for="fotos">Fotos (evidências)</label>
  <input id="fotos" type="file" accept="image/*" multiple>

  <button id="enviar">Enviar registro</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const msg = document.getElementById("msg");
  const sel = document.getElementById("tarefa");
  const btn = document.getElementById("enviar");
  let usuario = null;

  // Reduz a foto para caber no limite de 5 MB
  function comprimir(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Falha ao reduzir a foto")),
                 "image/jpeg", 0.8);
      };
      img.onerror = () => reject(new Error("Arquivo de imagem inválido"));
      img.src = URL.createObjectURL(file);
    });
  }

  async function iniciar() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { location.href = "index.html"; return; }

    const { data: perfil } = await db.from("usuarios")
      .select("nome, perfil").eq("id", session.user.id).single();
    if (!perfil || !["funcionario", "admin"].includes(perfil.perfil)) {
      location.href = "index.html"; return;
    }
    usuario = { id: session.user.id };
    document.getElementById("nome").textContent = perfil.nome;

    const { data: tarefas, error } = await db.from("tarefas")
      .select("id, nome").eq("ativa", true).order("nome");
    if (error) { msg.textContent = "Erro ao carregar tarefas: " + error.message; return; }
    tarefas.forEach(t => {
      const o = document.createElement("option");
      o.value = t.id; o.textContent = t.nome; sel.appendChild(o);
    });
  }

  btn.addEventListener("click", async () => {
    const arquivos = document.getElementById("fotos").files;
    if (!sel.value) { msg.textContent = "Escolha a tarefa."; return; }
    if (arquivos.length === 0) { msg.textContent = "Selecione pelo menos uma foto."; return; }

    btn.disabled = true;
    msg.textContent = "Enviando...";
    try {
      const { data: reg, error: e1 } = await db.from("registros_execucao")
        .insert({
          tarefa_id: sel.value,
          funcionario_id: usuario.id,
          observacao: document.getElementById("obs").value.trim() || null
        }).select().single();
      if (e1) throw e1;

      for (const arq of arquivos) {
        const blob = await comprimir(arq);
        const caminho = reg.id + "/" + crypto.randomUUID() + ".jpg";
        const { error: e2 } = await db.storage.from("evidencias")
          .upload(caminho, blob, { contentType: "image/jpeg" });
        if (e2) throw e2;
        const url = db.storage.from("evidencias").getPublicUrl(caminho).data.publicUrl;
        const { error: e3 } = await db.from("fotos")
          .insert({ registro_id: reg.id, url: url });
        if (e3) throw e3;
      }
      msg.textContent = "Registro enviado com sucesso!";
      sel.value = ""; document.getElementById("obs").value = "";
      document.getElementById("fotos").value = "";
    } catch (e) {
      msg.textContent = "Erro ao enviar: " + e.message;
    }
    btn.disabled = false;
  });

  document.getElementById("sair").addEventListener("click", async () => {
    await db.auth.signOut();
    location.href = "index.html";
  });

  iniciar();
</script>
</body>
</html>
