<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condomínio - Entrar</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;
       display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;padding:24px;border-radius:12px;width:90%;
        max-width:360px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  h1{font-size:1.3rem;margin:0 0 16px}
  input,button{width:100%;padding:12px;margin-bottom:12px;font-size:1rem;
               border-radius:8px;box-sizing:border-box}
  input{border:1px solid #ccc}
  button{background:#2563eb;color:#fff;border:0}
  #msg{font-size:.95rem}
</style>
</head>
<body>
<div class="card">
  <h1>Condomínio · Entrar</h1>
  <input id="email" type="email" placeholder="E-mail" autocomplete="username">
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <button id="entrar">Entrar</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const msg = document.getElementById("msg");

  document.getElementById("entrar").addEventListener("click", async () => {
    msg.textContent = "Entrando...";
    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("senha").value
      });
      if (error) { msg.textContent = "Erro no login: " + error.message; return; }

      const { data: perfil, error: erroPerfil } = await db
        .from("usuarios").select("nome, perfil")
        .eq("id", data.user.id).single();
      if (erroPerfil) { msg.textContent = "Login ok, erro no perfil: " + erroPerfil.message; return; }

      const destinos = { funcionario: "funcionario.html" };
      if (destinos[perfil.perfil]) {
        window.location.href = destinos[perfil.perfil];
      } else {
        msg.textContent = "Login feito! Olá, " + perfil.nome + ". Sua tela ainda será criada.";
      }
    } catch (e) {
      msg.textContent = "Erro inesperado: " + e.message + " (confira o config.js)";
    }
  });
</script>
</body>
</html>
